<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 800" role="img" aria-labelledby="t d">
  <title id="t">Devflow ticket route: plan, build, verify, review, merge</title>
  <desc id="d">Illustrative issue 12, "Add a health endpoint", travels through plan, build, verify, review and merge. Two human approval gates sit after planning and before merging. Review findings loop back to the coder.</desc>
  <style>
    .serif{font-family:Georgia,"Iowan Old Style","Palatino Linotype",serif}
    .mono{font-family:ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace}
    .sans{font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
    .ink{fill:#0e1b33}.cobalt{fill:#1f4fd8}.verm{fill:#b92d14}.mute{fill:#4a5670}
  </style>

  <rect width="1280" height="800" fill="#f6efdd"/>
  <g stroke="#0e1b33" stroke-opacity=".07">
    <path d="M0 100H1280M0 200H1280M0 300H1280M0 400H1280M0 500H1280M0 600H1280M0 700H1280"/>
    <path d="M100 0V800M200 0V800M300 0V800M400 0V800M500 0V800M600 0V800M700 0V800M800 0V800M900 0V800M1000 0V800M1100 0V800M1200 0V800"/>
  </g>
  <rect x="12" y="12" width="1256" height="776" fill="none" stroke="#0e1b33" stroke-width="3"/>
  <path d="M12 72H1268" stroke="#0e1b33" stroke-width="3"/>
  <text x="40" y="49" class="mono ink" font-size="15" letter-spacing="2.4" font-weight="700">PLATE 01 · ONE TICKET, END TO END</text>
  <text x="1240" y="49" text-anchor="end" class="mono verm" font-size="15" letter-spacing="2.4" font-weight="700">ILLUSTRATIVE EXAMPLE</text>

  <!-- issue card -->
  <g>
    <rect x="40" y="112" width="262" height="330" fill="#fffaf0" stroke="#0e1b33" stroke-width="2.5"/>
    <rect x="40" y="112" width="262" height="40" fill="#0e1b33"/>
    <text x="56" y="138" class="mono" fill="#f6efdd" font-size="14" letter-spacing="2" font-weight="700">GITHUB ISSUE #12</text>
    <text x="56" y="188" class="serif ink" font-size="27" font-weight="700">Add a health</text>
    <text x="56" y="218" class="serif ink" font-size="27" font-weight="700">endpoint</text>
    <path d="M56 238H286" stroke="#0e1b33" stroke-width="1.5"/>
    <text x="56" y="264" class="sans ink" font-size="15">Return JSON status from</text>
    <text x="56" y="286" class="mono cobalt" font-size="15" font-weight="700">GET /health</text>
    <text x="56" y="310" class="sans ink" font-size="15">Cover the response</text>
    <text x="56" y="332" class="sans ink" font-size="15">with a test.</text>
    <rect x="56" y="360" width="112" height="28" fill="none" stroke="#1f4fd8" stroke-width="2"/>
    <text x="68" y="379" class="mono cobalt" font-size="13" letter-spacing="1.4" font-weight="700">STATUS: READY</text>
    <rect x="56" y="398" width="130" height="28" fill="none" stroke="#0e1b33" stroke-width="1.5"/>
    <text x="68" y="417" class="mono ink" font-size="13" letter-spacing="1.4">LABEL: devflow</text>
    <circle cx="302" cy="300" r="7" fill="#0e1b33"/>
  </g>

  <!-- route -->
  <path class="route" pathLength="1" d="M302 300H1220" fill="none" stroke="#0e1b33" stroke-width="5"/>

  <!-- review loop -->
  <path class="loop" d="M940 262C940 160 650 160 650 262" fill="none" stroke="#1f4fd8" stroke-width="3"/>
  <path class="loop" d="M640 246L650 264L662 247" fill="none" stroke="#1f4fd8" stroke-width="3" stroke-dasharray="none"/>
  <text x="795" y="143" text-anchor="middle" class="mono cobalt" font-size="14" letter-spacing="1.6" font-weight="700">CHANGES REQUESTED</text>
  <text x="795" y="163" text-anchor="middle" class="sans mute" font-size="14">findings return to the coder</text>

  <!-- stage nodes -->
  <g class="node n1"><circle cx="360" cy="300" r="34" fill="#0e1b33"/><text x="360" y="311" text-anchor="middle" class="serif" fill="#f6efdd" font-size="32" font-weight="700">1</text></g>
  <g class="node n2"><polygon points="505,262 543,300 505,338 467,300" fill="#b92d14" stroke="#0e1b33" stroke-width="3"/><text x="505" y="306" text-anchor="middle" class="mono" fill="#fffaf0" font-size="14" font-weight="700">A</text></g>
  <g class="node n3"><circle cx="650" cy="300" r="34" fill="#0e1b33"/><text x="650" y="311" text-anchor="middle" class="serif" fill="#f6efdd" font-size="32" font-weight="700">2</text></g>
  <g class="node n4"><circle cx="795" cy="300" r="34" fill="#0e1b33"/><text x="795" y="311" text-anchor="middle" class="serif" fill="#f6efdd" font-size="32" font-weight="700">3</text></g>
  <g class="node n5"><circle cx="940" cy="300" r="34" fill="#0e1b33"/><text x="940" y="311" text-anchor="middle" class="serif" fill="#f6efdd" font-size="32" font-weight="700">4</text></g>
  <g class="node n6"><polygon points="1085,262 1123,300 1085,338 1047,300" fill="#b92d14" stroke="#0e1b33" stroke-width="3"/><text x="1085" y="306" text-anchor="middle" class="mono" fill="#fffaf0" font-size="14" font-weight="700">B</text></g>
  <g class="node n7"><circle cx="1220" cy="300" r="34" fill="#1f4fd8" stroke="#0e1b33" stroke-width="3"/><text x="1220" y="311" text-anchor="middle" class="serif" fill="#fffaf0" font-size="32" font-weight="700">5</text></g>

  <!-- stage labels -->
  <g class="sans ink" font-size="14.5" text-anchor="middle">
    <g transform="translate(360 372)"><text class="mono" font-size="15" letter-spacing="2" font-weight="700">PLAN</text><text y="26">OpenClaw refines</text><text y="46">requirements, asks</text><text y="66">questions, plans</text></g>
    <g transform="translate(505 372)"><text class="mono verm" font-size="15" letter-spacing="2" font-weight="700">GATE A</text><text y="26">You approve the</text><text y="46">plan with /approve</text><text y="66">on the issue</text></g>
    <g transform="translate(650 372)"><text class="mono" font-size="15" letter-spacing="2" font-weight="700">BUILD</text><text y="26">Tests, then code,</text><text y="46">in an isolated git</text><text y="66">worktree</text></g>
    <g transform="translate(795 372)"><text class="mono" font-size="15" letter-spacing="2" font-weight="700">VERIFY</text><text y="26">Engine gates run in</text><text y="46">a separate checkout;</text><text y="66">base commit compared</text></g>
    <g transform="translate(940 372)"><text class="mono" font-size="15" letter-spacing="2" font-weight="700">REVIEW</text><text y="26">Independent review</text><text y="46">of diff and gate</text><text y="66">evidence</text></g>
    <g transform="translate(1085 372)"><text class="mono verm" font-size="15" letter-spacing="2" font-weight="700">GATE B</text><text y="26">You approve the</text><text y="46">merge with /approve</text><text y="66">on the PR</text></g>
    <g transform="translate(1214 372)"><text class="mono" font-size="15" letter-spacing="2" font-weight="700">MERGE</text><text y="26">Reviewed commit</text><text y="46">only; SHA pinned</text><text y="66">Lessons recorded</text></g>
  </g>

  <!-- actor tags above nodes -->
  <g class="mono mute" font-size="12" letter-spacing="1.4" text-anchor="middle" font-weight="700">
    <text x="360" y="244">OPENCLAW</text>
    <text x="650" y="244" dy="0">CODING AGENT</text>
    <text x="795" y="244">ENGINE</text>
    <text x="940" y="244">REVIEWER</text>
    <text x="1220" y="244">ENGINE</text>
  </g>

  <!-- bottom ledger -->
  <g>
    <path d="M40 520H1240" stroke="#0e1b33" stroke-width="3"/>
    <path d="M40 526H1240" stroke="#0e1b33" stroke-width="1"/>
    <g transform="translate(40 566)">
      <text class="mono cobalt" font-size="15" letter-spacing="2.4" font-weight="700">THE ENGINE OWNS</text>
      <text y="30" class="sans ink" font-size="16">State transitions, tests, commits,</text>
      <text y="52" class="sans ink" font-size="16">pushes and merges. Progress lives in</text>
      <text y="74" class="sans ink" font-size="16">SQLite, so interrupted tickets resume.</text>
    </g>
    <g transform="translate(470 566)">
      <text class="mono cobalt" font-size="15" letter-spacing="2.4" font-weight="700">THE AGENTS SUPPLY</text>
      <text y="30" class="sans ink" font-size="16">Judgment, returned as validated</text>
      <text y="52" class="sans ink" font-size="16">responses. OpenClaw plans; Claude Code,</text>
      <text y="74" class="sans ink" font-size="16">Codex or Cursor build; a reviewer checks.</text>
    </g>
    <g transform="translate(900 566)">
      <text class="mono verm" font-size="15" letter-spacing="2.4" font-weight="700">YOU DECIDE</text>
      <text y="30" class="sans ink" font-size="16">Plan and merge approvals are separate</text>
      <text y="52" class="sans ink" font-size="16">and consumed once. A plan approval</text>
      <text y="74" class="sans ink" font-size="16">never authorizes the later merge.</text>
    </g>
    <path d="M440 548V690M870 548V690" stroke="#0e1b33" stroke-opacity=".35"/>
    <path d="M40 724H1240" stroke="#0e1b33" stroke-width="1"/>
    <text x="40" y="760" class="mono mute" font-size="13" letter-spacing="1.6">TICKET AND ISSUE NUMBER ARE EXAMPLES · DEFAULT GATES SHOWN · STOP FILE AND RUN LIMITS APPLY BETWEEN STAGES</text>
  </g>
</svg>
