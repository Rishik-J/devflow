[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "devflow"
version = "0.1.0"
description = "Deterministic dev-workflow engine with agent decision points; per-repo init tuned with a code graph"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "jsonschema>=4.23,<5",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "ruff>=0.9,<1",
]

[project.scripts]
devflow = "devflow.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/devflow"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
