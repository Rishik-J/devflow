[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "devflow"
version = "0.1.0"
description = "Deterministic dev-workflow engine with agent decision points; per-repo init tuned with a code graph"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Rishik J" }]
requires-python = ">=3.11"
dependencies = [
  "jsonschema>=4.23,<5",
]

[project.urls]
Homepage = "https://github.com/Rishik-J/devflow"
Repository = "https://github.com/Rishik-J/devflow"
Issues = "https://github.com/Rishik-J/devflow/issues"

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "ruff>=0.9,<1",
]

[project.scripts]
devflow = "devflow.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/devflow"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["ui_case(*ids): the plan use-case ids a browser scenario covers (devflow.uirunner)"]

[tool.ruff]
line-length = 100
target-version = "py311"
